name: test

on:
  push:
  pull_request:

jobs:
  hooks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bash hooks (Claude Code and Codex)
        shell: bash
        run: bash tests/hooks.sh
      - name: PowerShell hook (Codex on Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/hooks.ps1
