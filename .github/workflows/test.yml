name: test

on:
  push:
  pull_request:

jobs:
  hooks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bash hooks (Claude Code and Codex)
        shell: bash
        run: bash tests/hooks.sh
      - name: PowerShell hook (Codex on Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/hooks.ps1
      - name: Installer (macOS, Linux, WSL)
        shell: bash
        run: bash tests/install.sh
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install.ps1
      - name: Hermes plugin
        shell: bash
        run: python tests/hermes.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: OpenCode plugin
        shell: bash
        run: node tests/opencode.mjs
